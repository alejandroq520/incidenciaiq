services:
  db:
    image: postgres:15
    container_name: incidentiq_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: incident_iq
      LANG: en_US.utf8
      POSTGRES_INITDB_ARGS: "--lc-collate=en_US.utf8 --lc-ctype=en_US.utf8"
    ports:
      - "5433:5432"
    volumes:
      - incidentiq_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: .
    container_name: incidentiq_backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/incident_iq
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app

volumes:
  incidentiq_pgdata: